# Supabase CLI configuration (local development with Docker and linking to a
# hosted project). Secrets are NOT stored here: see .env.example and
# docs/DEPLOYMENT.md.
project_id = "pami-finance"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
# No demo data is seeded into real environments.
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "co.pamifinance://auth-callback"
additional_redirect_urls = ["co.pamifinance://auth-callback", "http://127.0.0.1:8080", "http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
# Production must confirm e-mail addresses (the local Docker-less stack autoconfirms).
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

# External providers stay disabled until configured with real credentials.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""

[auth.external.apple]
enabled = false
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.ai-status]
verify_jwt = true
[functions.parse-expense]
verify_jwt = true
[functions.extract-receipt]
verify_jwt = true
[functions.transcribe-audio]
verify_jwt = true
[functions.copilot]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
